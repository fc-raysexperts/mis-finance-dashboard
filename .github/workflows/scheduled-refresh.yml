# Scheduled data refresh for the MIS dashboard (replaces the old Vercel cron jobs).
#
#   01:17 AM IST  (19:47 UTC, previous day)  NIGHTLY JOB - one job that runs, in this order and one after another:
#                 P&L  ->  Order Book (recent invoices only)  ->  NPD (new and last-60-days bills only)
#   03:17 AM IST  (21:47 UTC, previous day)  SECOND CHANCE - the same three, but each only redoes what is NOT already
#                 done tonight. If the nightly job went well it finds nothing to do and ends in about a minute.
#   22:00 IST on days 8-14:   Order Book full re-read - acts only on the Saturday, i.e. the 2nd Saturday
#   22:00 IST on days 22-28:  NPD full re-read        - acts only on the Saturday, i.e. the 4th Saturday
#
# Why one job instead of three separate start times: GitHub keeps only ONE waiting run per queue and silently cancels any
# extra waiting ones, so separate half-hour runs could cancel each other whenever an earlier one overruns its slot.
# Running the three steps inside one job keeps the order and never overlaps.
#
# GitHub reads cron times in UTC and only runs schedules from the DEFAULT branch (main).
# One-time setup: GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#   APP_URL      your live dashboard address, e.g. https://your-dashboard.vercel.app
#   CRON_SECRET  the same value as CRON_SECRET in the Vercel project's environment variables
# To run something by hand: Actions tab -> "Scheduled data refresh" -> Run workflow, then pick:
#   all         P&L, Order Book, NPD (what the nightly job does)
#   retry       the second-chance pass
#   first-fill  P&L, then a FULL Order Book and a FULL NPD read - use this once after the first deploy
#   pl / ob / npd / ob-monthly / npd-monthly   one part only (the two monthly ones always run when picked by hand)
#
# Failure e-mails go to whoever last edited the cron lines below.

name: Scheduled data refresh

on:
  schedule:
    - cron: '47 19 * * *'
    - cron: '47 21 * * *'
    - cron: '30 16 8-14 * *'
    - cron: '30 16 22-28 * *'
  workflow_dispatch:
    inputs:
      phase:
        description: 'What to refresh now. all = P&L, Order Book, NPD. retry = second-chance pass. first-fill = P&L + FULL Order Book + FULL NPD (use once after the first deploy).'
        type: choice
        default: all
        options: [all, retry, first-fill, pl, ob, npd, ob-monthly, npd-monthly]

permissions:
  contents: read

concurrency:
  group: mis-scheduled-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Decide what to run
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          CHOSEN: ${{ github.event.inputs.phase }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$CHOSEN" in
              all)        P="pl ob npd" ;;
              retry)      P="pl-retry ob-retry npd-retry" ;;
              first-fill) P="pl ob-monthly npd-monthly" ;;
              *)          P="$CHOSEN" ;;
            esac
          else
            case "$SCHEDULE" in
              "47 19 * * *")    P="pl ob npd" ;;
              "47 21 * * *")    P="pl-retry ob-retry npd-retry" ;;
              "30 16 8-14 * *") P="ob-monthly" ;;
              "30 16 22-28 * *") P="npd-monthly" ;;
              *)                P="" ;;
            esac
          fi
          echo "Running: ${P:-nothing}"
          echo "phases=$P" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            api
            src/data
            scripts

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Refresh
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          PHASES: ${{ steps.pick.outputs.phases }}
        run: |
          FAIL=0
          for p in $PHASES; do
            node scripts/scheduledRefresh.mjs "$p" || FAIL=1
          done
          exit $FAIL
